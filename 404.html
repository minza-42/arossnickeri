<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidan hittades inte - Aros Snickeri</title>
  <link rel="icon" type="image/png" href="aros-snickeri.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Lato", Arial, Helvetica, sans-serif;
      font-weight: 300;
      background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    h1,
    h2,
    h3 {
      font-family: "Playfair Display", serif;
      font-weight: 700;
      color: #333;
      line-height: 1.4;
    }

    .error-container {
      text-align: center;
      max-width: 600px;
      background: #fff;
      padding: 60px 40px;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      position: relative;
    }

    .error-container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #c7081b 0%, #e63946 50%, #c7081b 100%);
      border-radius: 8px 8px 0 0;
    }

    .logo {
      width: 180px;
      height: auto;
      margin-bottom: 30px;
    }

    .error-code {
      font-size: 8rem;
      font-weight: 700;
      color: #c7081b;
      line-height: 1;
      margin-bottom: 20px;
      text-shadow: 2px 2px 0 rgba(199, 8, 27, 0.1);
    }

    h1 {
      font-size: 2rem;
      color: #333;
      margin-bottom: 15px;
    }

    p {
      font-size: 1.1rem;
      color: #666;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .error-actions {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 40px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 30px;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .btn-primary {
      background-color: #c7081b;
      color: #fff;
      border: 2px solid #c7081b;
    }

    .btn-primary:hover {
      background-color: #a00616;
      border-color: #a00616;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(199, 8, 27, 0.3);
    }

    .btn-secondary {
      background-color: transparent;
      color: #333;
      border: 2px solid #ddd;
    }

    .btn-secondary:hover {
      background-color: #f5f5f5;
      border-color: #c7081b;
      color: #c7081b;
    }

    .arrow {
      font-size: 1.2rem;
      transition: transform 0.3s;
    }

    .btn:hover .arrow {
      transform: translateX(5px);
    }

    .helpful-links {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid #eee;
    }

    .helpful-links h3 {
      font-size: 1.2rem;
      color: #333;
      margin-bottom: 15px;
    }

    .links-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .link-item {
      text-align: left;
      padding: 10px;
      background: #f9f9f9;
      border-radius: 4px;
      transition: background 0.3s;
    }

    .link-item:hover {
      background: #f0f0f0;
    }

    .link-item a {
      color: #c7081b;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .link-item a:hover {
      text-decoration: underline;
    }

    .link-item a::before {
      content: "▸";
      color: #c7081b;
      font-size: 1rem;
    }

    /* Responsive */
    @media screen and (max-width: 768px) {
      .error-container {
        padding: 40px 30px;
      }

      .error-code {
        font-size: 6rem;
      }

      h1 {
        font-size: 1.6rem;
      }

      p {
        font-size: 1rem;
      }

      .links-grid {
        grid-template-columns: 1fr;
      }

      .logo {
        width: 150px;
      }
    }

    @media screen and (max-width: 480px) {
      .error-container {
        padding: 30px 20px;
      }

      .error-code {
        font-size: 5rem;
      }

      h1 {
        font-size: 1.4rem;
      }

      .btn {
        padding: 12px 25px;
        font-size: 0.95rem;
      }
    }
  </style>
</head>

<body>

  <div class="error-container">
    <!-- Logo -->
    <img src="img/arossnickeri-logo.webp" alt="Aros Snickeri Logotyp" class="logo">

    <!-- Error Code -->
    <div class="error-code">404</div>

    <!-- Error Message -->
    <h1>Sidan hittades inte</h1>
    <p>Tyvärr kunde vi inte hitta sidan du söker. Den kan ha flyttats, tagits bort eller så har länken blivit felaktig.
    </p>

    <!-- Action Buttons -->
    <div class="error-actions">
      <a href="index.html" class="btn btn-primary">
        Till startsidan
        <span class="arrow">→</span>
      </a>
      <a href="javascript:history.back()" class="btn btn-secondary">
        ← Gå tillbaka
      </a>
    </div>

    <!-- Helpful Links -->
    <div class="helpful-links">
      <h3>Populära sidor</h3>
      <div class="links-grid">
        <div class="link-item">
          <a href="html/om-oss.html">Om oss</a>
        </div>
        <div class="link-item">
          <a href="html/vad-vi-gor.html">Vad vi gör</a>
        </div>
        <div class="link-item">
          <a href="html/kontakt.html">Kontakt</a>
        </div>
        <div class="link-item">
          <a href="html/offentliga-miljoer.html">Offentliga miljöer</a>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
<!-- IE needs 512+ bytes: https://docs.microsoft.com/archive/blogs/ieinternals/friendly-http-error-pages -->
